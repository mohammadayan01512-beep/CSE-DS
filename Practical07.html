<!-- Aim: Use class, ID and pseudo-class selectors for styling. -->
<!DOCTYPE html>
<html>
<head>
    <title>Responsive Webpage</title>

    <style>
        body {
            background-color: lightblue;
            text-align: center;
        }

        .box {
            background-color: white;
            padding: 30px;
            margin: 20px;
            font-size: 25px;
        }

        @media screen and (max-width: 600px) {
            body {
                background-color: lightgreen;
            }

            .box {
                font-size: 16px;
                margin: 5px;
            }
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Responsive Design</h2>
        <p>Resize your browser window.</p>
    </div>

</body>
</html>
