<!-- Aim: Structure a webpage using semantic HTML5 tags.-->
<!DOCTYPE html> 
<html>
<head>
    <title>Semantic HTML</title>
</head>
<body>

<header>
    <h1>My Website</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<main>
    <section>
        <h2>About Us</h2>
        <p>Welcome to my website.</p>
    </section>

    <article>
        <h2>HTML5</h2>
        <p>HTML5 is used to create webpages.</p>
    </article>

    <aside>
        <p>Related Information</p>
    </aside>
</main>

<footer>
    <p>Copyright 2026</p>
</footer>

</body>
</html>
