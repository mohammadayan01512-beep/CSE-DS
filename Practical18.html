<!-- Aim: Create an image slideshow using JavaScript. -->

<!DOCTYPE html>
<html>
<head>
    <title>Image Slideshow</title>

    <style>
        img {
            width: 350px;
            height: 250px;
        }
    </style>
</head>
<body>

<h2>Image Slideshow</h2>

<img id="slide" src="image1.jpg">

<br><br>

<button onclick="previous()">Previous</button>
<button onclick="next()">Next</button>

<script>
    let images = [
        "image1.jpg",
        "image2.jpg",
        "image3.jpg"
    ];

    let index = 0;

    function showImage() {
        document.getElementById("slide").src =
        images[index];
    }

    function next() {
        index = (index + 1) % images.length;
        showImage();
    }

    function previous() {
        index = (index - 1 + images.length) % images.length;
        showImage();
    }
</script>

</body>
</html>
