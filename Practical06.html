<!-- Aim: Use class, ID and pseudo-class selectors for styling -->
<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>
        /* Element selector */
        h1 {
            color: blue;
        }

        /* Class selector */
        .box {
            background-color: yellow;
            padding: 15px;
        }

        /* ID selector */
        #heading {
            color: red;
        }

        /* Pseudo-class */
        button:hover {
            background-color: green;
            color: white;
        }
    </style>
</head>
<body>

    <h1>CSS Selectors</h1>

    <h2 id="heading">ID Selector</h2>

    <p class="box">Class Selector Example</p>

    <button>Move Mouse Here</button>

</body>
</html>
