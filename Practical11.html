<!-- Aim: Implement if-else statements and loops in JavaScript. -->

<!DOCTYPE html>
<html>
<head>
    <title>Control Structures</title>
</head>
<body>

<h2>JavaScript Control Statements</h2>

<script>
    let number = 10;

    // If-else
    if (number % 2 == 0) {
        document.write("Number is Even<br>");
    } else {
        document.write("Number is Odd<br>");
    }

    // For loop
    document.write("For Loop:<br>");

    for (let i = 1; i <= 5; i++) {
        document.write(i + "<br>");
    }

    // While loop
    document.write("While Loop:<br>");

    let j = 1;

    while (j <= 5) {
        document.write(j + "<br>");
        j++;
    }
</script>

</body>
</html>
