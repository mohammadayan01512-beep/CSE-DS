<!-- Aim: Write a JavaScript program using variables, data types and operators. -->
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Basics</title>
</head>
<body>

<h2>JavaScript Variables and Operators</h2>

<script>
    let a = 20;
    let b = 10;

    let name = "Ayan";
    let age = 20;

    document.write("Name: " + name + "<br>");
    document.write("Age: " + age + "<br>");

    document.write("Addition: " + (a + b) + "<br>");
    document.write("Subtraction: " + (a - b) + "<br>");
    document.write("Multiplication: " + (a * b) + "<br>");
    document.write("Division: " + (a / b) + "<br>");
    document.write("Modulus: " + (a % b) + "<br>");
</script>

</body>
</html>
