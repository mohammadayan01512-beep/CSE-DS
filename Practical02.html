<!-- Aim: Design a webpage using tables, audio, video and iframe. -->
 
<!DOCTYPE html>
<html>
<head>
    <title>Table and Multimedia</title>
</head>
<body>

<h2>Student Information</h2>

<table border="1" >
    <tr>
        <th>Name</th>
        <th>Roll No</th>
        <th>Branch</th>
    </tr>
    <tr>
        <td>Ayan</td>
        <td>101</td>
        <td>CSE</td>
    </tr>
    <tr>
        <td>Rahul</td>
        <td>102</td>
        <td>IT</td>
    </tr>
</table>

<h2>Audio</h2>
<audio controls>
    <source src="audio.mp3" type="audio/mpeg">
</audio>

<h2>Video</h2>
<video width="300" controls>
    <source src="video.mp4" type="video/mp4">
</video>

<h2>Iframe</h2>
<iframe
    src="https://www.wikipedia.org"
    width="400"
    height="250">
</iframe>

</body>
</html>
