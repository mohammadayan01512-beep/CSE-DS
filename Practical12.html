<!-- Aim: Create and use functions in JavaScript. -->

<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Functions</title>
</head>
<body>

<h2>Functions in JavaScript</h2>

<script>
    function add(a, b) {
        return a + b;
    }

    function multiply(a, b) {
        return a * b;
    }

    let sum = add(10, 20);
    let product = multiply(5, 4);

    document.write("Addition = " + sum + "<br>");
    document.write("Multiplication = " + product);
</script>

</body>
</html>
