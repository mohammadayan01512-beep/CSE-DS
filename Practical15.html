<!-- Aim: Perform DOM manipulation to change webpage content and styles dynamically.-->

<!DOCTYPE html>
<html>
<head>
    <title>DOM Manipulation</title>
</head>
<body>

<h2 id="heading">Hello World</h2>

<p id="para">This is an old paragraph.</p>

<button onclick="changeContent()">
    Change Content
</button>

<script>
    function changeContent() {

        document.getElementById("heading").innerHTML =
        "Welcome to JavaScript";

        document.getElementById("para").innerHTML =
        "Content Changed Successfully";

        document.getElementById("heading").style.color =
        "blue";

    }
</script>

</body>
</html>
