<!-- Aim: Apply inline, internal and external CSS methods on one webpage -->
<!DOCTYPE html>
<html>
<head>
    <title>CSS Methods</title>

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
            text-align: center;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 style="color:red;">Inline CSS Example</h1>

    <h2>Internal CSS Example</h2>

    <p>This paragraph uses External CSS.</p>

</body>
</html>
